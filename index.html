<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skylar Learning Center - 導師報更及排班管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col font-sans">

    <header class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 text-white p-2 rounded-lg font-bold flex items-center justify-center shadow">
                    <i data-lucide="calendar" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-slate-800 leading-tight">Skylar Learning Center</h1>
                    <p class="text-xs text-slate-500">兼職導師報更及排班管理系統 (正式上線版)</p>
                </div>
            </div>

            <div id="userInfoHeader" class="hidden flex items-center space-x-4">
                <div class="text-right">
                    <span id="currentUserName" class="block font-semibold text-slate-800 text-sm"></span>
                    <span id="currentUserRole" class="block text-xs text-slate-500"></span>
                </div>
                <button onclick="logout()" class="flex items-center space-x-1 text-sm text-red-600 hover:text-red-700 bg-red-50 hover:bg-red-100 px-3 py-1.5 rounded-lg transition font-medium">
                    <i data-lucide="log-out" class="w-4 h-4"></i>
                    <span>登出</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
        <!-- LOGIN SCREEN -->
        <div id="loginSection" class="max-w-md mx-auto my-12 bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden">
            <div class="p-8">
                <div class="text-center mb-8">
                    <div class="inline-flex items-center justify-center w-16 h-16 bg-indigo-100 text-indigo-600 rounded-2xl mb-4">
                        <i data-lucide="lock" class="w-8 h-8"></i>
                    </div>
                    <h2 class="text-2xl font-bold text-slate-800">系統登入</h2>
                    <p class="text-sm text-slate-500 mt-1">請輸入您的導師或管理員帳號</p>
                </div>

                <div id="loginError" class="hidden mb-4 p-3 bg-red-50 border border-red-200 text-red-600 text-sm rounded-lg flex items-center space-x-2">
                    <i data-lucide="alert-circle" class="w-4 h-4 flex-shrink-0"></i>
                    <span id="loginErrorMsg">帳號或密碼錯誤</span>
                </div>

                <form onsubmit="handleLogin(event)" class="space-y-5">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">使用者名稱 / 帳號</label>
                        <input type="text" id="loginUsername" required placeholder="例如：shanyeung 或 admin" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">密碼</label>
                        <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition text-sm">
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition shadow hover:shadow-md text-sm">
                        安全登入
                    </button>
                </form>
            </div>
        </div>

        <!-- ADMIN VIEW -->
        <div id="adminSection" class="hidden space-y-6">
            <div class="bg-slate-900 rounded-2xl p-6 text-white shadow-lg flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                    <span class="inline-block px-3 py-1 bg-amber-500/20 text-amber-300 rounded-full text-xs font-semibold mb-2">管理員控制台</span>
                    <h2 class="text-2xl font-bold">排班審批、時段與帳號管理</h2>
                </div>
                <div class="flex flex-wrap gap-2">
                    <button onclick="forceSyncToCloud()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2 rounded-lg text-sm transition flex items-center space-x-1.5 shadow">
                        <i data-lucide="cloud-upload" class="w-4 h-4"></i><span>手動強制同步至 Google Sheet</span>
                    </button>
                </div>
            </div>

            <div class="flex space-x-2 border-b border-slate-200">
                <button id="tabBtnTutors" class="px-5 py-2.5 font-medium text-sm border-b-2 border-indigo-600 text-indigo-600">導師帳號管理</button>
            </div>

            <div id="adminTabTutors" class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-6">
                <div class="flex justify-between items-center border-b pb-4">
                    <h3 class="text-base font-bold text-slate-800">導師帳號及密碼管理</h3>
                    <button onclick="openAddTutorModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2 rounded-lg text-sm shadow">新增導師帳號</button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left text-slate-600">
                        <thead class="bg-slate-50 text-slate-700 font-semibold border-b">
                            <tr>
                                <th class="p-3">導師姓名</th>
                                <th class="p-3">登入帳號</th>
                                <th class="p-3">專科 / 科目</th>
                                <th class="p-3">WhatsApp 電話</th>
                                <th class="p-3">密碼</th>
                                <th class="p-3 text-right">操作</th>
                            </tr>
                        </thead>
                        <tbody id="tutorManagementTable" class="divide-y"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- MODAL FOR TUTOR -->
    <div id="tutorModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
            <h3 id="tutorModalTitle" class="text-lg font-bold text-slate-800 border-b pb-3">新增導師帳號</h3>
            <form onsubmit="handleSaveTutor(event)" class="space-y-4">
                <input type="hidden" id="editTutorKey">
                <div><label class="block text-xs font-semibold mb-1">導師姓名</label><input type="text" id="modalTutorName" required class="w-full p-2.5 border rounded-lg text-sm"></div>
                <div><label class="block text-xs font-semibold mb-1">專科 / 科目</label><input type="text" id="modalTutorSubjects" class="w-full p-2.5 border rounded-lg text-sm"></div>
                <div><label class="block text-xs font-semibold mb-1">登入帳號 (Username)</label><input type="text" id="modalTutorUser" required class="w-full p-2.5 border rounded-lg text-sm"></div>
                <div><label class="block text-xs font-semibold mb-1">WhatsApp 電話</label><input type="text" id="modalTutorPhone" class="w-full p-2.5 border rounded-lg text-sm"></div>
                <div><label class="block text-xs font-semibold mb-1">密碼</label><input type="text" id="modalTutorPass" required class="w-full p-2.5 border rounded-lg text-sm font-mono"></div>
                <div class="flex justify-end space-x-3 pt-2">
                    <button type="button" onclick="closeTutorModal()" class="px-4 py-2 border rounded-lg text-sm">取消</button>
                    <button type="submit" class="px-5 py-2 bg-indigo-600 text-white rounded-lg text-sm font-semibold">儲存帳號</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const GOOGLE_APP_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzUtm7s-sRt2PPgbCoVu39HctBsNEIs9sl3MuOIwUFP1Ww-Odg-Eu57i5oj7-ETPHIj/exec';

        // 內建所有導師資料，確保任何時候登入都不會遺失
        const DEFAULT_USERS = {
            "admin": { name: "系統管理員", subjects: "Admin", role: "admin", pass: "admin123", phone: "98888888" },
            "shanyeung": { name: "Yeung Man Shan", subjects: "-", role: "tutor", pass: "123456", phone: "54" },
            "abbywong": { name: "Abby Wong", subjects: "-", role: "tutor", pass: "123456", phone: "55" },
            "angustang": { name: "Angus Tang", subjects: "-", role: "tutor", pass: "123456", phone: "63" },
            "gracewong": { name: "Grace Wong", subjects: "-", role: "tutor", pass: "123456", phone: "55" },
            "himlau": { name: "Him Lau", subjects: "-", role: "tutor", pass: "123456", phone: "62" },
            "joechan": { name: "Joe Chan", subjects: "-", role: "tutor", pass: "123456", phone: "66" },
            "matthewlo": { name: "Matthew Lo", subjects: "-", role: "tutor", pass: "123456", phone: "94" },
            "milliceau": { name: "Millice Au", subjects: "-", role: "tutor", pass: "123456", phone: "96" },
            "quincepang": { name: "Quince Pang", subjects: "-", role: "tutor", pass: "123456", phone: "59" },
            "henryli": { name: "Henry Li", subjects: "-", role: "tutor", pass: "123456", phone: "51" },
            "soniatang": { name: "Sonia Tang", subjects: "-", role: "tutor", pass: "123456", phone: "92" }
        };

        let users = JSON.parse(localStorage.getItem('skylar_users_v20') || JSON.stringify(DEFAULT_USERS));
        let currentUser = null;
        let daysConfig = JSON.parse(localStorage.getItem('skylar_days_config_v20') || '{}');
        let submissions = JSON.parse(localStorage.getItem('skylar_weekly_submissions_v20') || '{}');

        document.addEventListener("DOMContentLoaded", () => {
            lucide.createIcons();
            fetchCloudData();
        });

        function fetchCloudData() {
            fetch(`${GOOGLE_APP_SCRIPT_URL}?action=getData`)
                .then(res => res.json())
                .then(data => {
                    if (data && data.users && Object.keys(data.users).length > 1) {
                        users = data.users;
                        localStorage.setItem('skylar_users_v20', JSON.stringify(users));
                    }
                    checkLoginState();
                })
                .catch(err => {
                    checkLoginState();
                });
        }

        function forceSyncToCloud() {
            syncCloudData();
            alert("已成功將所有導師資料與排班同步至 Google Sheet 雲端！");
        }

        function syncCloudData() {
            localStorage.setItem('skylar_users_v20', JSON.stringify(users));
            localStorage.setItem('skylar_weekly_submissions_v20', JSON.stringify(submissions));
            localStorage.setItem('skylar_days_config_v20', JSON.stringify(daysConfig));

            const payload = {
                type: 'saveAll',
                users: users,
                submissions: submissions,
                daysConfig: daysConfig
            };

            fetch(GOOGLE_APP_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            }).catch(() => {});
        }

        function checkLoginState() {
            const saved = localStorage.getItem('skylar_logged_user');
            if (saved && users[saved]) loginUser(saved);
        }

        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('loginUsername').value.trim();
            const p = document.getElementById('loginPassword').value.trim();

            if (users[u] && users[u].pass === p) {
                localStorage.setItem('skylar_logged_user', u);
                loginUser(u);
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        }

        function loginUser(username) {
            currentUser = username;
            const userData = users[username];

            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('userInfoHeader').classList.remove('hidden');
            document.getElementById('currentUserName').innerText = userData.name;
            document.getElementById('currentUserRole').innerText = userData.role === 'admin' ? '系統管理員' : '兼職導師';

            if (userData.role === 'admin') {
                document.getElementById('adminSection').classList.remove('hidden');
                renderTutorManagement();
            }
            lucide.createIcons();
        }

        function logout() {
            localStorage.removeItem('skylar_logged_user');
            location.reload();
        }

        function renderTutorManagement() {
            const tbody = document.getElementById('tutorManagementTable');
            tbody.innerHTML = '';
            Object.keys(users).filter(u => users[u].role === 'tutor').forEach(u => {
                const t = users[u];
                tbody.innerHTML += `<tr class="hover:bg-slate-50"><td class="p-3 font-semibold">${t.name}</td><td class="p-3 font-mono">${u}</td><td class="p-3">${t.subjects || '-'}</td><td class="p-3 font-mono">${t.phone || '-'}</td><td class="p-3 font-mono">${t.pass}</td><td class="p-3 text-right"><button onclick="deleteTutor('${u}')" class="text-rose-600 font-medium text-xs">刪除</button></td></tr>`;
            });
        }

        function openAddTutorModal() {
            document.getElementById('editTutorKey').value = '';
            document.getElementById('modalTutorName').value = '';
            document.getElementById('modalTutorUser').value = '';
            document.getElementById('modalTutorPhone').value = '';
            document.getElementById('modalTutorPass').value = '';
            document.getElementById('tutorModal').classList.remove('hidden');
        }

        function closeTutorModal() { document.getElementById('tutorModal').classList.add('hidden'); }

        function handleSaveTutor(e) {
            e.preventDefault();
            const name = document.getElementById('modalTutorName').value.trim();
            const username = document.getElementById('modalTutorUser').value.trim();
            const phone = document.getElementById('modalTutorPhone').value.trim();
            const pass = document.getElementById('modalTutorPass').value.trim();

            users[username] = { name, subjects: "-", role: 'tutor', pass, phone };
            syncCloudData();
            closeTutorModal();
            renderTutorManagement();
        }

        function deleteTutor(u) {
            if (confirm("確定刪除？")) {
                delete users[u];
                syncCloudData();
                renderTutorManagement();
            }
        }
    </script>
</body>
</html>
